<style>

.ch{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.ch button{border:1px solid var(--pr);background:var(--cd);color:var(--pr);border-radius:99px;padding:5px 12px;font-size:12px;cursor:pointer}

const apiBase=()=>{const a=ld("api","");return a?String(a).replace(/\/+$/,""):(/^https?:/.test(location.protocol)?location.origin:"")};
async function api(path,o={}){
  const b=apiBase();if(!b)return{ok:false,off:true};
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),8000);
  try{
    const r=await fetch(b+path,{method:o.m||"GET",headers:{"Content-Type":"application/json",...(o.tok?{Authorization:"Bearer "+o.tok}:{})},body:o.b?JSON.stringify(o.b):undefined,signal:c.signal});
    let j=null;try{j=await r.json()}catch(e){}
    return{ok:r.ok,status:r.status,j};
  }catch(e){return{ok:false,off:true}}
  finally{clearTimeout(tm)}
}

/* ---------- 2) Better severity: the model scores every region of the photo ---------- */
const sevOf=(st,dis)=>dis<0?0:st<15?1:st<40?2:3,SVC=["#2e9e4f","#e0a21b","#e8741f","#c0392b"];
function leafFrac(px,nx,ny){const W=px.width,Ht=px.height,d=px.data,a=new Float32Array(nx*ny),c=new Uint32Array(nx*ny);
 for(let y=0;y<Ht;y++){const j=Math.min(ny-1,Math.floor(y*ny/Ht));for(let x=0;x<W;x++){const i=Math.min(nx-1,Math.floor(x*nx/W)),o=(y*W+x)*4,r=d[o],g=d[o+1],b=d[o+2],k=j*nx+i;c[k]++;
  if((g>r*1.05&&g>b*1.1)||(r>110&&g>100&&b<r*.6&&Math.abs(r-g)<70)||(r>g&&g>b&&r>60&&r<190&&g<r*.85))a[k]++}}
 return Array.from(a,(v,k)=>v/(c[k]||1))}
async function dlTiles(){
 const m=DL.meta,sz=m.size||224,src=S.big||S.px,W=src.width,Ht=src.height;
 const idx=m.classes.map((c,i)=>i).filter(i=>m.classes[i].ok&&m.classes[i].crop==S.crop);
 if(!idx.length)return null;
 const t0=Math.min(W,Ht)/4,nx=Math.max(1,Math.round(W/t0)),ny=Math.max(1,Math.round(Ht/t0)),n=nx*ny,leaf=leafFrac(S.px,nx,ny),boxes=[];
 for(let j=0;j<ny;j++)for(let i=0;i<nx;i++)boxes.push([j/ny,i/nx,(j+1)/ny,(i+1)/nx]);
 const out=tf.tidy(()=>{let x=tf.browser.fromPixels(src).toFloat().expandDims(0);
  x=tf.image.cropAndResize(x,tf.tensor2d(boxes),tf.zeros([n],"int32"),[sz,sz]);
  x=m.norm=="-1-1"?x.div(127.5).sub(1):x.div(255);return DL.model.predict(x)});
 const flat=Array.from(await out.data());out.dispose();
 const K=flat.length/n;if(!Number.isInteger(K)||K<2)return null;
 let wsum=0,waff=0,psum=0,pn_=0;const hm=[],cnt={};
 for(let k=0;k<n;k++){
  let v=flat.slice(k*K,(k+1)*K);const sum=v.reduce((a,b)=>a+b,0);
  if(Math.abs(sum-1)>.01){const mx=Math.max(...v);v=v.map(z=>Math.exp(z-mx));const z=v.reduce((a,b)=>a+b,0);v=v.map(a=>a/z)}
  const mass=idx.reduce((a,i)=>a+v[i],0)||1;let pd=0,bi=-1,bp=0;
  idx.forEach(i=>{const cl=m.classes[i];if(cl.disease>=0){const p=v[i]/mass;pd+=p;if(p>bp){bp=p;bi=cl.disease}}});
  if(leaf[k]<.2){hm.push(-1);continue}
  hm.push(Math.round(pd*100));wsum+=leaf[k];
  if(pd>=.5){waff+=leaf[k];psum+=pd;pn_++;cnt[bi]=(cnt[bi]||0)+leaf[k]}
 }
 if(wsum<=0)return null;
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
 return{nx,ny,hm,st:Math.round(waff/wsum*100),dis:top?+top[0]:-1,pa:pn_?Math.round(psum/pn_*100):0}}
function sevMerge(r,tl){
 if(!tl)return;
 if(r.dis<0&&tl.st>=25&&tl.dis>=0){r.dis=tl.dis;r.cf=Math.max(50,tl.pa)}
 r.st=r.dis>=0?Math.max(1,tl.st):tl.st;r.sm="t";r.hm=tl.hm;r.gw=tl.nx;r.gh=tl.ny}
function sevBox(r){

 const lv=sevOf(r.st,r.dis),hm=r.hm&&r.th&&r.gw&&r.gh,n=hm?r.hm.filter(p=>p>=0).length:0;
 const ov=hm?`<div style="position:relative;margin-top:10px"><img src="${r.th}" alt="" style="width:100%;border-radius:10px;display:block"><svg viewBox="0 0 ${r.gw} ${r.gh}" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;border-radius:10px">${r.hm.map((p,k)=>p<0?"":`<rect x="${k%r.gw}" y="${Math.floor(k/r.gw)}" width="1" height="1" fill="#e0301e" fill-opacity="${(p/100*.6).toFixed(2)}" stroke="#fff" stroke-opacity=".35" stroke-width=".02"/>`).join("")}</svg></div>`:"";
 return`<div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${t("sv_t")}</b><span class="bd" style="color:${SVC[lv]};border-color:${SVC[lv]};background:transparent">${t("sv"+lv)} · ${r.st}%</span></div><div style="height:10px;border-radius:5px;background:var(--bd);margin:10px 0 4px;overflow:hidden"><div style="height:100%;width:${Math.min(100,r.st)}%;background:${SVC[lv]}"></div></div><div class="mu">${t("sv_g")}</div>${ov}<div class="mu" style="margin-top:6px">${hm?t("sv_m1").replace("{n}",n):t("sv_m2")}</div></div>`}

  return`<div class="box"><b>${ok?"✓ "+t("e_ok"):t("e_fix")}</b>${ok?"":`<div>${t("dis")}: <b>${ds}</b>${v.fdis>=0?` · ${t("af")}: <b>${v.fst}%</b>`:""}</div>`}${v.note?`<div class="mu">${t("e_note")}: ${esc(v.note)}</div>`:""}<div class="mu">${t("e_by")}: ${esc(v.ex||"")}</div></div>`}
 if(r.rq)return`<div class="box"><b>${t("e_sent")}</b><div class="mu">${ld("rvq",[]).some(x=>x.body.rid==r.id)?t("e_queued"):t("e_sentS")}</div></div>`;
 return`<button class="bt o" data-a="rvreq">${t("e_ask")}</button><p class="mu" style="margin-top:6px">${t("e_askS")}</p>`}
